# ===== 服务端口 =====
server.port=9090
server.address=0.0.0.0

# imagePath 本地图片上传的允许根目录（防任意文件读取；toRealPath 后须位于此目录内）
image.allowed-dir=/tmp/tb_img

# ===== 签名后端 =====
# h5      : 标准 H5 token 握手 + MD5 sign（自动获取有效 token，默认，协议层可打通）
# rpc     : 转发到用户自建的 unidbg-server / 真机签名服务（app 私有 x-sign 的合法来源）
# unidbg  : 本地补环境模拟 libsgmain（需按 HOOK_GUIDE 补 JNI）
# mock    : 离线确定性占位（联调 / 降级）
search.sign-backend=h5
search.sign-fallback=true

# ===== MTOP H5 token 握手 =====
# 首次请求无 token -> 网关下发 _m_h5_tk(Set-Cookie) -> 重算 sign -> 带 Cookie 重发
mtop.token-handshake.enabled=true
mtop.token-handshake.max-retries=2
# token 软过期时间（秒），仅用于 health 状态展示；真实失效由网关 TOKEN_EXPIRED 触发刷新
mtop.token-ttl-seconds=600

# ===== BYO 合法凭据（可选，留空则自动握手获取）=====
# 使用者可填入自己合法持有的 _m_h5_tk token 或完整 Cookie，跳过自动握手
mtop.token=
mtop.cookie=

# ===== BYO 设备身份（native x-sign 的 utdid/deviceId/sid 三要素）=====
# 关键：签名 payload 里的 utdid/deviceId 必须与 x-utdid/x-devid 头一致，否则 ILEGAL_SIGN。
# 留空则自动生成：utdid=24位，deviceId=44位，sid=空(未登录)。
# 用真机抓包值注入可大幅提升 native 签名被认可的概率：
mtop.utdid=
mtop.device-id=
mtop.sid=
# 经纬度也参与 native 70102 INPUT 段11/12（真机抓包为模拟器默认 37.42195/-122.084013）
mtop.lat=
mtop.lng=
# umt：真机 umid 设备指纹（base64，随设备固定，Grida hook 实测 7fKhy... 会话值）。
# 真机未登录能出数据的关键差异之一：真机 umt 是服务端认可的真实值，非全零/随机。
# 填入你自己抓包的值可大幅提升通过率：
mtop.umt=
mtop.app-conf-v=0

# ===== 外部签名服务（backend=rpc 时生效）=====
# 指向自建 unidbg-server / 真机 frida-rpc 的签名接口，例如 http://127.0.0.1:9091/api/sign
sign.rpc.url=
sign.rpc.token=
sign.rpc.timeout-ms=5000
# 真机 Frida RPC 签名后端（tools/frida_rpc_bridge.py）：
#   python3 tools/frida/build_rpc_bundle.py
#   python3 tools/frida_rpc_bridge.py --port 9091
#   启动参数：--search.sign-backend=rpc --sign.rpc.url=http://127.0.0.1:9091/api/sign
#            --mtop.protocol=app --mtop.gateway=https://acs.m.taobao.com/gw/
#            --mtop.app-key=21646297 --mtop.ttid=231200@taobao_android_10.69.10
# 桥接服务 GET /device 会回传真机 utdid/deviceId/umt，默认自动同步给请求侧；
# 如需完全自己控制设备身份，设置 sign.rpc.sync-device=false 并手动配置上方 mtop.utdid 等。
sign.rpc.sync-device=true

# ===== unidbg 配置（默认关闭；开启前请补齐 JNI，见 docs/HOOK_GUIDE.md）=====
unidbg.enabled=false
unidbg.apk-path=native/com.taobao.taobao.apk
unidbg.so-name=libsgmainso-6.8.261102.so
unidbg.verbose=false

# ===== MTOP 网关与身份（可用真机抓包结果覆盖）=====
mtop.gateway=https://h5api.m.taobao.com/h5/
mtop.app-key=12574478
mtop.ttid=taobao@android_10.28.0
# 协议模式：h5=H5 网关（MD5 sign，配 mock 网关联调用）；app=App 网关（https://acs.m.taobao.com/gw/ + unidbg 四头，
# 实测可穿越 TMD 前置设备指纹层，见 docs/HOOK_GUIDE.md 风控章节）
mtop.protocol=h5

# ===== App 协议真机对齐配置（Frida hook 10.69.10 buildParams 实测，见 HOOK_GUIDE.md 第11章）=====
# 切 app 模式时用这些值覆盖（可复制下面一整行作为启动参数）：
# --mtop.protocol=app --mtop.gateway=https://acs.m.taobao.com/gw/ --mtop.app-key=21646297
# --mtop.ttid=231200@taobao_android_10.69.10 --mtop.app-version=10.69.10
# --mtop.utdid=<真机24位> --mtop.device-id=<真机44位> --mtop.umt=<真机umid>
# 文本搜索接口：native=真机10.69实际接口 mtop.relationrecommend.MtopRecommend.recommend（未登录可出数据）
#               legacy=老接口 mtop.taobao.wsearch.appsearch（引导到登录墙）
# 由 mtop.protocol 自动决定：app->native，h5->legacy，无需手配
# 真机搜索页公共参数（x-app-conf-v/netType/nq/x-page-name/f-refer 等）已在 MtopHttpClient app 模式自动注入

# ===== 免登录原生搜索（mtop.protocol=native，见 HOOK_GUIDE.md 第18章）=====
# 走 App 原生 anetwork 栈（MtopBuilder.syncRequest）+ 游客态，绕开手工 HTTP form 被
# bixi 标 wh_ttid=pc 的 web 风控。这是当前最接近真机 UI 的免登录形态：
#   1) 先启动 frida bridge：python3 tools/frida_rpc_bridge.py --port 9091
#      （bridge 需在模拟器/真机上 attach 淘宝 App，App 至少启动过一次）
#   2) 启动时加：--mtop.protocol=native --sign.rpc.native-search-url=http://127.0.0.1:9091/api/search/native
# 说明：图片/文本均走原生栈。风控允许时（真机 UI 可搜时刻）出真实数据；
#       bixi 风控期返回 FAIL_SYS_USER_VALIDATE / TRAFFIC_LIMIT（服务端环境状态，非代码缺陷）。
sign.rpc.native-search-url=
